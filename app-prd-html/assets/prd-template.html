<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
:root{--ink:#292d3d;--muted:#656b79;--bg:#f5f6f8;--line:#e1e5eb;--accent:#b53f35;--soft:#fff2ed}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:28px}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}button,input{font:inherit}button{cursor:pointer;color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #28758b;outline-offset:3px}[hidden]{display:none!important}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr)}.sidebar{height:100vh;position:sticky;top:0;background:white;border-right:1px solid var(--line);padding:30px 18px;display:flex;flex-direction:column;gap:24px;overflow:auto}
.brand{font-size:23px;font-weight:800;overflow-wrap:anywhere}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px;font-weight:500}nav{display:grid;gap:7px}nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:9px;color:var(--muted);font-size:12px}nav a.active{background:var(--soft);color:var(--accent);font-weight:700}
.badge{font-size:12px;line-height:1.7;padding:1px 6px;border-radius:5px;background:#fff0de;color:#8d4e13;border:1px solid #efd4b7;white-space:nowrap;font-weight:500}.badge.done{background:#e8f4ed;color:#176e60;border-color:#c7e2d4}.badge.reference{background:#eef0f4;color:#555e6d;border-color:#dce0e6}.side-meta{margin-top:auto;color:var(--muted);font-size:12px}.side-meta time{display:block}
main{min-width:0;max-width:1500px;padding:36px clamp(22px,4vw,64px) 50px}header{margin-bottom:32px}.intro{font-size:16px;line-height:1.85;color:#515867;margin-top:16px}.intro strong{color:var(--ink)}h1{font-size:30px;line-height:1.3;margin:0 0 10px}h2{font-size:22px;line-height:1.4;margin:0}h3{font-size:16px;margin:0 0 12px}p{margin:0 0 10px}.section-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}section{margin-bottom:40px;scroll-margin-top:28px}.block{min-width:0;margin-bottom:16px}.copy{background:white;border:1px solid var(--line);border-radius:14px;padding:20px 24px}.copy p:last-child{margin:0}.note{color:var(--muted);font-size:12px;margin:12px 0 0;overflow-wrap:anywhere}
.table-wrap{border:1px solid var(--line);border-radius:14px;background:white;overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:110px}thead th{background:#eef0f4;font-weight:650;white-space:nowrap}tbody th{font-weight:650}tbody tr:last-child>*{border-bottom:0}.detail-row td{background:#eef1f5}
.btn{border:1px solid var(--line);border-radius:9px;background:white;padding:8px 13px;min-height:38px;font-size:12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.active{border-color:var(--accent);color:var(--accent);background:var(--soft)}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.gallery{display:flex;flex-wrap:nowrap;gap:16px;overflow-x:auto;align-items:flex-start;padding:3px 3px 8px;min-width:0;max-width:100%}.shot{margin:0;background:white;border:1px solid var(--line);border-radius:14px;padding:16px;flex:1 0 240px;min-width:240px;text-align:center}.shot figcaption{font-weight:700;margin-bottom:12px}.image-button{border:0;padding:0;display:block;background:transparent;max-width:260px;margin:auto;width:100%;border-radius:9px;overflow:hidden;line-height:0}.image-button img{width:100%;height:auto;display:block}.image-button:hover{box-shadow:0 0 0 2px #dca396}.detail-row .shot{flex:0 0 250px}.media-aside{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,310px);gap:20px;align-items:start}.media-aside>div{min-width:0}.motion video{display:block;width:100%;max-width:260px;height:auto;max-height:560px;margin:auto;background:#e8e9ed;border-radius:9px}.motion .shot{min-width:0}.motion .gallery{display:block}.motion-status{min-height:22px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}.link-card{border:1px solid var(--line);border-radius:12px;background:white;padding:18px;min-width:0}.link-card label{display:block;font-weight:700}.link-card input{width:100%;border:1px solid #ccd2db;padding:9px;border-radius:7px;margin:9px 0}.link-status{display:block;font-size:12px;min-height:20px}.lightbox{border:0;border-radius:12px;background:var(--bg);padding:16px;max-width:96vw;max-height:95vh}.lightbox::backdrop{background:#293044b8}.lightbox img{display:block;max-width:88vw;max-height:78vh;margin:12px auto 0}.lightbox p{margin:12px 0 0}noscript{display:block;padding:20px}
@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr)}.sidebar{padding:24px 12px}main{padding:30px 22px}.media-aside{grid-template-columns:1fr}.media-aside>.motion{max-width:340px;justify-self:center;width:100%}}
@media(max-width:720px){.layout{display:block}.sidebar{height:auto;position:static;padding:16px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow-x:auto}nav a{white-space:nowrap}main{padding:24px 16px}h1{font-size:26px}h2{font-size:20px}.links{grid-template-columns:1fr}.shot{flex:0 0 245px;min-width:245px}.section-head{align-items:flex-start}th,td{padding:12px}.side-meta time{display:inline;margin-left:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.sidebar,.toolbar,.btn,.lightbox{display:none!important}.layout{display:block}main{max-width:none;padding:0}body{background:white}.gallery{overflow:visible;flex-wrap:wrap}.shot{break-inside:avoid}.table-wrap{overflow:visible}.links{grid-template-columns:1fr}}
#back-directory{font-size:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--muted)}
</style></head>
<body><div class="layout"><aside class="sidebar"><a id="back-directory" hidden>← 返回目录</a><div class="brand" id="brand"></div><nav aria-label="功能目录"></nav><div class="side-meta">文档更新时间<time id="updated"></time></div></aside><main><header><h1></h1><div class="intro" id="intro"></div></header><div id="sections"></div></main></div>
<dialog class="lightbox" aria-label="页面大图"><button class="btn" id="close-lightbox">关闭大图</button><p id="large-title"></p><img id="large-image" alt=""></dialog>
<noscript>请在启用 JavaScript 的浏览器中打开此文档，以查看正文和页面交互。</noscript>
<script type="application/json" id="prd-data">__PRD_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('prd-data').textContent);
const media=data.media||{},statuses={todo:'待开发',integrating:'待接入','needs-info':'待补充',done:'已完成',reference:'现有能力'};
const provenance={'app-capture':'实际页面 / 录屏','app-render':'现有 UI 真实渲染','design-reference':'设计示意'};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const btn=(text,callback)=>{const n=el('button','btn',text);n.type='button';n.addEventListener('click',callback);return n};
const key='app-prd:'+data.document_id+':'+data.revision;let draft={};try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))draft=saved}catch(_){}
if(data.hub_project_id&&data.hub_url){const u=new URL(data.hub_url);if(['https:','http:'].includes(u.protocol)){u.searchParams.set('project',data.hub_project_id);const back=document.getElementById('back-directory');back.href=u.href;back.hidden=false}}
document.documentElement.style.setProperty('--accent',data.accent||'#b53f35');document.querySelector('h1').textContent=data.title;
document.getElementById('brand').append(document.createTextNode(data.project),el('small','', 'PRODUCT REQUIREMENTS · PRD'));
const time=document.getElementById('updated');time.dateTime=data.updated_at;time.textContent=data.updated_label;
for(const [name,paragraphs] of [['需求背景',data.background],['本期目标',data.goals]])for(const text of paragraphs){const p=el('p');p.append(el('strong','',name+'：'),document.createTextNode(text));document.getElementById('intro').append(p)}
const modal=document.querySelector('dialog');document.getElementById('close-lightbox').onclick=()=>modal.close();
function openImage(id){const m=media[id],img=document.getElementById('large-image');img.src=m.src;img.alt=m.title;document.getElementById('large-title').textContent=m.title;modal.showModal()}
function photo(id){const m=media[id],figure=el('figure','shot'),button=btn('',()=>openImage(id)),img=el('img');figure.append(el('figcaption','',m.title));button.className='image-button';button.setAttribute('aria-label','放大：'+m.title);img.src=m.src;img.alt=m.title;img.loading='lazy';button.append(img);figure.append(button,el('p','note',provenance[m.provenance]));return figure}
function gallery(ids){const n=el('div','gallery');ids.forEach(id=>n.append(photo(id)));return n}
function setActive(buttons,current){buttons.forEach(b=>{b.classList.toggle('active',b===current);b.setAttribute('aria-pressed',String(b===current))})}
let nextRow=0;
function table(block){const wrap=el('div','table-wrap'),table=el('table'),head=el('thead'),tr=el('tr'),body=el('tbody'),hasMedia=block.rows.some(r=>r.media?.length);for(const text of [...block.columns,...(hasMedia?['页面']:[])]){const th=el('th','',text);th.scope='col';tr.append(th)}head.append(tr);table.append(head,body);wrap.append(table);for(const row of block.rows){const line=el('tr');row.cells.forEach((text,i)=>{const cell=el(i?'td':'th','',text);if(!i)cell.scope='row';line.append(cell)});body.append(line);if(hasMedia){const cell=el('td');line.append(cell);if(row.media?.length){const details=el('tr','detail-row'),td=el('td');details.id='detail-'+nextRow++;details.hidden=true;td.colSpan=block.columns.length+1;td.append(gallery(row.media));details.append(td);const b=btn('查看页面',()=>{details.hidden=!details.hidden;b.textContent=details.hidden?'查看页面':'收起页面';b.setAttribute('aria-expanded',String(!details.hidden))});b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls',details.id);cell.append(b);body.append(details)}}}return wrap}
function states(block){const n=el('div'),bar=el('div','toolbar'),content=el('div'),note=el('p','note');bar.setAttribute('role','group');bar.setAttribute('aria-label',block.title||'页面状态');let buttons=[];function select(item,b){setActive(buttons,b);content.replaceChildren(gallery(item.media));note.textContent=item.note||'';note.hidden=!item.note}buttons=block.items.map(item=>btn(item.label,()=>select(item,buttons[block.items.indexOf(item)])));bar.append(...buttons);n.append(bar,content,note);select(block.items[0],buttons[0]);return n}
function motion(block){const n=el('div','motion'),bar=el('div','toolbar'),figure=el('figure','shot'),title=el('figcaption'),video=el('video'),still=el('div'),status=el('p','note motion-status'),m=media[block.video],sourceNote=el('p','note',provenance[m.provenance]);video.src=m.src;video.controls=true;video.muted=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label',m.title);if(m.poster)video.poster=media[m.poster].src;title.textContent=m.title;status.textContent='点击播放动效';status.setAttribute('aria-live','polite');still.hidden=true;let staticButtons=[];
 const play=btn('播放动效',async()=>{setActive(staticButtons,null);video.hidden=false;still.hidden=true;title.textContent=m.title;sourceNote.textContent=provenance[m.provenance];video.currentTime=0;try{await video.play()}catch(_){status.textContent='请使用视频播放按钮'}});play.classList.add('primary');bar.append(play);
 staticButtons=(block.stills||[]).map(id=>btn(media[id].title,()=>{video.pause();video.hidden=true;still.hidden=false;still.replaceChildren(photo(id).querySelector('.image-button'));title.textContent=media[id].title;sourceNote.textContent=provenance[media[id].provenance];status.textContent='静态预览';setActive(staticButtons,staticButtons[(block.stills||[]).indexOf(id)])}));bar.append(...staticButtons);
 video.addEventListener('play',()=>{play.textContent='重播动效';status.textContent='播放中'});video.addEventListener('pause',()=>{if(!video.ended)status.textContent='已暂停'});video.addEventListener('ended',()=>status.textContent='播放结束，可重播');video.addEventListener('error',()=>status.textContent='视频暂不可用，请查看静态页面');document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause()});figure.append(title,video,still,status,sourceNote);n.append(bar,figure);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches&&staticButtons.length)staticButtons[0].click();return n}
function linkStatus(input,status){status.replaceChildren();if(!input.value.trim()){status.textContent='待补充';return}try{const u=new URL(input.value);if(!['https:','http:'].includes(u.protocol))throw Error();const a=el('a','','打开文档 ↗');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';status.append(a)}catch(_){status.textContent='请填写完整的 http/https 文档链接'}}
function links(block){const n=el('div'),grid=el('div','links');for(const item of block.items){const card=el('div','link-card'),label=el('label','',item.title),input=el('input'),status=el('span','link-status');input.type='url';input.id='link-'+item.id;input.dataset.docLink=item.id;label.htmlFor=input.id;input.placeholder='接入文档链接（待补充）';input.value=typeof draft[item.id]==='string'?draft[item.id]:(item.url||'');input.setAttribute('value',input.value);input.oninput=()=>{input.setAttribute('value',input.value);draft[item.id]=input.value;try{localStorage.setItem(key,JSON.stringify(draft))}catch(_){}linkStatus(input,status)};linkStatus(input,status);card.append(label,input,status);grid.append(card)}const exportButton=btn('导出含链接的 HTML',exportDoc);exportButton.classList.add('primary');n.append(grid,exportButton);return n}
function blockView(block){const n=el('div','block');if(block.title)n.append(el('h3','',block.title));if(block.type==='text'){const copy=el('div','copy');block.paragraphs.forEach(p=>copy.append(el('p','',p)));n.append(copy)}else if(block.type==='table')n.append(table(block));else if(block.type==='gallery')n.append(gallery(block.media));else if(block.type==='states')n.append(states(block));else if(block.type==='motion')n.append(motion(block));else if(block.type==='links')n.append(links(block));if(block.note)n.append(el('p','note',block.note));return n}
const nav=document.querySelector('nav'),sections=document.getElementById('sections');
data.sections.forEach((section,i)=>{const number=String(i+1).padStart(2,'0'),label=number+'　'+section.title,badge=()=>el('span','badge '+section.status,statuses[section.status]),a=el('a');a.href='#'+section.id;a.append(el('span','',label),badge());nav.append(a);const node=el('section'),heading=el('div','section-head');node.id=section.id;heading.append(el('h2','',label),badge());node.append(heading);if(section.layout==='media-aside'){const grid=el('div','media-aside'),copy=el('div');section.blocks.slice(0,-1).forEach(b=>copy.append(blockView(b)));const side=blockView(section.blocks.at(-1));side.classList.add('motion');grid.append(copy,side);node.append(grid)}else section.blocks.forEach(b=>node.append(blockView(b)));sections.append(node)});
const navLinks=[...nav.querySelectorAll('a')];function updateNav(){let current=data.sections[0].id;for(const section of sections.children){if(section.getBoundingClientRect().top<=130)current=section.id}navLinks.forEach(a=>{a.classList.toggle('active',a.hash==='#'+current);if(a.hash==='#'+current)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}let scheduled=false;addEventListener('scroll',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;updateNav()})}},{passive:true});updateNav();
function exportDoc(){const output=JSON.parse(JSON.stringify(data));output.revision=Date.now().toString(36);output.sections.forEach(s=>s.blocks.filter(b=>b.type==='links').forEach(b=>b.items.forEach(item=>{item.url=document.querySelector('[data-doc-link="'+item.id+'"]').value})));const copy=document.documentElement.cloneNode(true);copy.querySelector('#prd-data').textContent=JSON.stringify(output).replace(/</g,'\\u003c').replace(/&/g,'\\u0026');copy.querySelector('#brand').replaceChildren();copy.querySelector('nav').replaceChildren();copy.querySelector('#intro').replaceChildren();copy.querySelector('#sections').replaceChildren();copy.querySelector('dialog').removeAttribute('open');copy.querySelector('#large-image').removeAttribute('src');copy.querySelector('#large-title').textContent='';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'})),a=el('a');a.href=url;a.download=data.title.replace(/[\\/:*?"<>|]/g,'-')+'-含链接.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
</script></body></html>
