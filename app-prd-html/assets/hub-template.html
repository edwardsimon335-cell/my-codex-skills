e}.empty{padding:32px;color:var(--muted)}.page-note{font-size:11px;color:#9ba2af;margin:18px 2px 0}noscript{display:block;padding:30px}

.brand{padding:0 10px 28px;font-size:15px}.brand-mark{background:linear-gradient(150deg,#526784,#26384e);box-shadow:inset 0 1px 1px #ffffff73,0 3px 7px #293d5e1c;border-radius:11px}
.nav-label{font-size:11px;color:#7b8799}.project-link{border:1px solid transparent;border-radius:13px;min-height:48px;color:#536076}.project-link:hover{background:#ffffff70}.project-link[aria-current=page]{background:linear-gradient(180deg,#ffffffed,#ffffff9c);border-color:#ffffffed;box-shadow:0 3px 10px #3a4d7810,inset 0 1px 0 #fff;color:#315dcc}.mini-icon{border-radius:8px;background:#ffffff8c;border-color:#d5deeb}.project-link[aria-current=page] .mini-icon{background:#eaf0ff;border-color:#d7e2fa}
.sidebar-footer{color:#7d8ca2;padding-left:10px}.workspace{border-radius:24px;min-width:0}.topbar{height:36px;border:0;background:transparent;padding:0 26px;gap:8px;font-size:11px;color:#7f8c9e}.topbar .current{color:#5b6b82}
main{padding:24px 26px 60px;max-width:1300px}.project-header{margin-bottom:28px;gap:15px}.project-avatar{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#fff,#e6edff);border:1px solid #fff;box-shadow:inset 0 1px 1px #fff,0 4px 12px #5776b51a;color:#4164b7;font-size:17px}.eyebrow{font-size:9px;color:#7183a0}h1{font-size:27px;letter-spacing:-.8px}
.section-head{margin-bottom:12px}.document-list{border:1px solid #ffffffd9;border-radius:20px;background:#ffffffb8;box-shadow:0 4px 22px #41557208,inset 0 1px 0 #fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.doc-row{min-height:90px;padding:20px 22px}.doc-row:hover{background:#ffffffc7}.doc-icon{border-radius:12px;background:linear-gradient(145deg,#fff,#eef3ff);border-color:#e2e9f6;color:#6482ba;box-shadow:0 2px 4px #5475ac08}.doc-title{color:#27354a}.doc-subtitle{color:#7c899e}.doc-meta{color:#7c899e}.open{border:1px solid #e1e7f0;border-radius:18px;background:#ffffffa6;padding:6px 10px;color:#5a6d8c}.doc-row:hover .open{border-color:#cad8f1;background:#eff4ff}.doc-row:focus-visible{border-radius:20px}

@media(max-width:900px){.layout{grid-template-columns:208px minmax(0,1fr);gap:10px}main{padding:22px 18px 40px}.topbar{padding:0 18px}.doc-row{padding:18px}.open{padding:6px}}
@media(max-width:640px){.layout{display:block;padding:10px}.sidebar{position:static;height:auto;padding:16px;border-radius:22px}.brand{padding:0}.mobile-projects{margin-top:14px}.mobile-projects label{margin-bottom:5px}.mobile-projects select{background:#ffffffb3;border-color:#ffffff;border-radius:12px;padding:9px 12px}.sidebar-footer{display:none}.workspace{margin-top:8px}.topbar{height:28px;padding:0 10px}main{padding:18px 8px 40px}.project-header{margin-bottom:24px}.project-avatar{width:46px;height:46px;border-radius:14px}h1{font-size:24px}.doc-row{padding:18px 14px;grid-template-columns:36px minmax(0,1fr) 28px}.open{padding:5px;border-radius:50%;border-color:#e5ebf4}.doc-icon{width:34px}.doc-title{font-size:14px}.doc-meta{font-size:11px}}

<body>
<div class="layout">
<aside class="sidebar"><div class="brand"><img class="hub-brand-art" src="hub-document-glass-v1.png" alt="" width="38" height="38">需求文档</div><div class="nav-label"><span>项目</span><span id="project-count"></span></div><nav aria-label="项目导航"></nav><div class="mobile-projects"><label for="project-select">当前项目</label><select id="project-select"></select></div><div class="sidebar-footer">产品经理：黄浩宇</div></aside>
<div class="workspace"><header class="topbar"><span>项目</span><span class="slash">/</span><span id="breadcrumb" class="current"></span></header>
<main><div class="project-header"><div id="avatar" class="project-avatar" aria-hidden="true"></div><div><div class="eyebrow">PROJECT DOCUMENTS</div><h1 id="project-title"></h1></div></div><section aria-labelledby="list-title"><div class="section-head"><h2 id="list-title">版本需求</h2><span class="total" id="document-count" aria-live="polite"></span></div><div class="document-list" id="documents"></div></section></main>
</div></div>
<noscript>请启用 JavaScript 查看项目目录。也可直接访问 <a href="/ab01/initial/">示例需求</a>。</noscript>
<script type="application/json" id="catalog">
{"projects": [{"id": "ab01", "name": "示例项目", "code": "AB01", "documents": [{"id": "initial", "title": "首版功能需求", "version": null, "updatedAt": null, "href": "/ab01/initial/"}]}]}
</script>
<script>
'use strict';
const catalog=JSON.parse(document.getElementById('catalog').textContent),projects=catalog.projects,nav=document.querySelector('nav'),select=document.getElementById('project-select');
const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const icons={file:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 12h6M9 16h4"/></svg>',arrow:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>'};
function projectUrl(id){const url=new URL(location.href);url.searchParams.set('project',id);return url}
function current(){return projects.find(p=>p.id===new URL(location.href).searchParams.get('project'))||projects[0]}
function render(){const project=current();document.title=project.name+' · 需求文档';document.getElementById('project-title').textContent=project.name;document.getElementById('breadcrumb').textContent=project.name;document.getElementById('avatar').textContent=project.code;document.getElementById('document-count').textContent=project.documents.length+' 份文档';select.value=project.id;nav.querySelectorAll('a').forEach(a=>{if(a.dataset.project===project.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const list=document.getElementById('documents');list.replaceChildren();for(const doc of project.documents){const row=make('a','doc-row');row.href=doc.href;const icon=make('span','doc-icon');icon.innerHTML=icons.file;const info=make('div','doc-info');info.append(make('div','doc-title',doc.title),make('div','doc-subtitle',doc.version?doc.version+' · 产品需求文档':'产品需求文档'));row.append(icon,info);if(doc.updatedAt){const meta=make('div','doc-meta','更新于');meta.append(document.createElement('br'));const time=make('time','',new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Shanghai'}).format(new Date(doc.updatedAt)).replaceAll('/','.'));time.dateTime=doc.updatedAt;meta.append(time);row.append(meta)}const open=make('span','open');open.append(make('span','','查看文档'));open.insertAdjacentHTML('beforeend',icons.arrow);row.append(open);list.append(row)}if(!project.documents.length)list.append(make('div','empty','暂无需求文档'))}
function choose(id){if(id===current().id)return;history.pushState(null,'',projectUrl(id));render()}
for(const project of projects){const a=make('a','project-link');a.href=projectUrl(project.id);a.dataset.project=project.id;a.append(make('span','mini-icon',project.code),make('span','',project.name),make('span','count',String(project.documents.length)));a.addEventListener('click',e=>{if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();choose(project.id)});nav.append(a);const option=make('option','',project.name);option.value=project.id;select.append(option)}
document.getElementById('project-count').textContent=projects.length;select.addEventListener('change',()=>choose(select.value));addEventListener('popstate',render);render();
</script></body></html>
